name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install facter
      run: |
        sudo apt-get update
        sudo apt-get install -y facter
        # Verify facter is working and check version
        facter --version
        facter architecture
        # Test JSON support
        facter --json architecture || echo "JSON not supported, will test fallback"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - name: Lint with ruff
      run: ruff check .

    - name: Check formatting with ruff
      run: ruff format --check .

    - name: Type check with mypy
      run: mypy facter/

    - name: Run tests
      run: pytest -v --cov=facter --cov-report=term-missing

  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: "3.13"
    - uses: pre-commit/action@v3.0.1
